# Test configuration
spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  data:
    redis:
      host: localhost
      port: 6379

  kafka:
    bootstrap-servers: localhost:9092

url-shortener:
  base-url: http://localhost:8080
  snowflake:
    datacenter-id: 1
    machine-id: 1
  cache:
    ttl-hours: 1
  rate-limit:
    enabled: false

logging:
  level:
    root: WARN
    com.urlshortener: DEBUG
