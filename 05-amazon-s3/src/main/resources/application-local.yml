server:
  port: 9000

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/s3db
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: localhost
      port: 6379

  kafka:
    bootstrap-servers: localhost:9092

storage:
  root-path: ./data/objects
  temp-path: ./data/temp

security:
  enabled: false

logging:
  level:
    root: INFO
    com.amazons3: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql: TRACE
