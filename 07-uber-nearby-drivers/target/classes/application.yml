server:
  port: 8080

spring:
  application:
    name: uber-nearby-drivers
  
  datasource:
    url: jdbc:postgresql://localhost:5432/uber_nearby
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
  
  data:
    redis:
      host: localhost
      port: 6379
      password: ""
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 50
          max-idle: 20
          min-idle: 10
          max-wait: 1000ms
  
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: 1
      retries: 3
      batch-size: 16384
      buffer-memory: 33554432
      linger-ms: 5
      properties:
        max.block.ms: 5000
    consumer:
      group-id: uber-nearby-drivers
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset: latest
      enable-auto-commit: false
      properties:
        spring.json.trusted.packages: com.uber.dto

# Application-specific configuration
uber:
  location:
    # Location update settings
    update-interval-ms: 4000
    stale-threshold-ms: 30000
    max-speed-kmh: 200
    
    # Geospatial settings
    default-search-radius-meters: 5000
    max-search-radius-meters: 20000
    min-search-radius-meters: 500
    default-driver-limit: 20
    max-driver-limit: 50
    
    # H3 settings
    h3-resolution: 9
    h3-search-ring-size: 3
    
    # Geohash settings
    geohash-precision: 7
    
    # Privacy settings
    location-fuzz-meters: 50
    coordinate-precision: 5
  
  matching:
    # Driver matching weights
    distance-weight: 0.4
    rating-weight: 0.2
    acceptance-rate-weight: 0.2
    eta-weight: 0.15
    surge-penalty-weight: 0.05
    
    # Matching timeouts
    match-timeout-seconds: 30
    driver-response-timeout-seconds: 15
  
  websocket:
    # WebSocket settings
    heartbeat-interval-ms: 30000
    max-connections-per-user: 3

# Caching
cache:
  driver-metadata:
    ttl-seconds: 60
    max-size: 100000
  city-config:
    ttl-seconds: 300
    max-size: 1000

# Actuator and metrics
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    tags:
      application: ${spring.application.name}
    export:
      prometheus:
        enabled: true

# Logging
logging:
  level:
    root: INFO
    com.uber: DEBUG
    org.springframework.data.redis: DEBUG
    org.springframework.kafka: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
