spring:
  profiles:
    active: test
  
  datasource:
    url: jdbc:h2:mem:uber_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    database-platform: org.hibernate.dialect.H2Dialect
  
  data:
    redis:
      host: localhost
      port: 6379
  
  kafka:
    bootstrap-servers: localhost:9092

# Disable Kafka auto-configuration for tests
spring.autoconfigure.exclude:
  - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

uber:
  location:
    stale-threshold-ms: 30000
    max-speed-kmh: 200
    default-search-radius-meters: 5000
    h3-resolution: 9
    geohash-precision: 7

logging:
  level:
    root: INFO
    com.uber: DEBUG
