spring:
  datasource:
    url: jdbc:mysql://localhost:3306/youtube?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: youtube
    password: youtube_password
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  
  data:
    redis:
      host: localhost
      port: 6379
  
  kafka:
    bootstrap-servers: localhost:9092

youtube:
  id-generator:
    datacenter-id: 1
    worker-id: 1
  
  sharding:
    enabled: false  # Disable for local testing

logging:
  level:
    com.youtube: DEBUG
    org.hibernate.SQL: DEBUG
