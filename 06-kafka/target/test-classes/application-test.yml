spring:
  profiles:
    active: test
  
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  
  data:
    redis:
      host: localhost
      port: 6379

kafka:
  broker:
    id: 0
    host: localhost
    port: 9092
  log:
    dir: ${java.io.tmpdir}/kafka-test-logs
    segment:
      bytes: 1048576
    retention:
      ms: 3600000
      bytes: -1
  producer:
    batch-size: 1024
    linger-ms: 0
  consumer:
    fetch-max-bytes: 1048576
    max-poll-records: 100
    session-timeout-ms: 10000
  group:
    session-timeout-ms: 10000
    rebalance-timeout-ms: 60000
    heartbeat-interval-ms: 1000

logging:
  level:
    root: WARN
    com.kafka: DEBUG
