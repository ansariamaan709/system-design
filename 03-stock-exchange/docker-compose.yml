version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15
    container_name: stockexchange-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: stockexchange
    ports:
      - "5432:5432"
    volumes:
      - stockexchange-pg-data:/var/lib/postgresql/data
      - ./src/main/resources/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: stockexchange-redis
    ports:
      - "6379:6379"
    volumes:
      - stockexchange-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Kafka (using Redpanda for better developer experience)
  kafka:
    image: docker.redpanda.com/redpandadata/redpanda:latest
    container_name: stockexchange-kafka
    command:
      - redpanda start
      - --smp 1
      - --memory 512M
      - --overprovisioned
      - --kafka-addr PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr PLAINTEXT://localhost:9092
    ports:
      - "9092:9092"
      - "9644:9644"  # Admin API
    volumes:
      - stockexchange-kafka-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9644/v1/status/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Application (optional - for full containerized setup)
  # app:
  #   build: .
  #   container_name: stockexchange-app
  #   ports:
  #     - "8080:8080"
  #   environment:
  #     SPRING_PROFILES_ACTIVE: local
  #     DB_HOST: postgres
  #     DB_PORT: 5432
  #     DB_NAME: stockexchange
  #     DB_USERNAME: postgres
  #     DB_PASSWORD: postgres
  #     REDIS_HOST: redis
  #     REDIS_PORT: 6379
  #     KAFKA_SERVERS: kafka:9092
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #     redis:
  #       condition: service_healthy
  #     kafka:
  #       condition: service_healthy
  #   restart: unless-stopped

volumes:
  stockexchange-pg-data:
  stockexchange-redis-data:
  stockexchange-kafka-data:
